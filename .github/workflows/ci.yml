name: Verify Gastro Core
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Prisma schema
        run: npm run prisma:validate
      - name: Build and generate Prisma client
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: HTTP tests
        run: npm run test:e2e

  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gastro_core_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gastro_core_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gastro_core_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply all migrations to fresh PostgreSQL
        run: npm run prisma:deploy
      - name: Verify migrations are synchronized
        run: npm run prisma:status
      - name: Replay PUR-A SQL safely on populated schema
        run: npx prisma db execute --file prisma/migrations/20261017150000_pur_a_purchase_documents/migration.sql
      - name: Assert DEL-A D1 customer and primary-address integrity
        run: npx prisma db execute --file prisma/ci/del-a-d1-integrity.sql
      - name: Assert DEL-A D3 platform reference and bank-ledger uniqueness
        run: npx prisma db execute --file prisma/ci/del-a-d3-ledger-integrity.sql
      - name: Assert DEL-A D4 one-sale, one-delivery and one-cash-handover uniqueness
        run: npx prisma db execute --file prisma/ci/del-a-d4-integrity.sql
      - name: Reapply safely without creating duplicate objects
        run: npm run prisma:deploy
      - name: Generate Prisma client for REP-A SQL smoke
        run: npm run prisma:generate
      - name: Execute REP-A R4B/R4C reporting SQL on PostgreSQL
        run: npx tsx prisma/ci/rep-a-r4c-query-smoke.ts
